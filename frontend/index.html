<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bazaario V 2.0| Shop Everything</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">Bazaario V 2.0<span class="brand-dot">.</span></a>
      <ul class="navbar-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li id="nav-dynamic"></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="page-header">
        <h1>Discover great deals by MJ enterprises</h1>
        <p>EVERYTHING IS POSSIBLE FOR MONU JANGRA SO DO NOT TAKE TENSION RELATED TO WEBSITE AND SERVERS </p>
      </div>

      <form class="toolbar" id="filter-form">
        <input type="text" id="search-input" placeholder="Search products by name or description..." />
        <select id="category-select">
          <option value="">All Categories</option>
        </select>
        <button type="submit">Search</button>
        <button type="button" class="secondary" id="clear-filters-btn">Clear</button>
      </form>

      <div class="product-grid" id="product-grid">
        <div class="loading-state">Loading products...</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    &copy; 2026 Bazaario V 2.0. Built for learning purposes only -- not a real store.
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
