<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In | Bazaario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">Bazaario<span class="brand-dot">.</span></a>
      <ul class="navbar-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li id="nav-dynamic"></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="auth-wrapper">
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Log in to view your profile.</p>

        <div class="alert" id="form-alert"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn-primary" id="login-submit-btn">Log In</button>
        </form>

        <p class="auth-footer-note">Don't have an account? <a href="register.html">Register here</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    &copy; 2026 Bazaario. Built for learning purposes only -- not a real store.
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
